<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 900" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="560" y="28" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">agentic-rag-mcp — how it works</text>
  <text x="560" y="46" text-anchor="middle" font-size="12" fill="#64748b">runtime query path, the backends it reaches, and the seeding/tooling scripts that fill them</text>

  <!-- ① query path -->
  <text x="100" y="66" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1.5">① QUERY PATH (RUNTIME)</text>

  <!-- Clients -->
  <g fill="#eff6ff" stroke="#3b82f6">
    <rect x="80" y="78" width="300" height="58" rx="8"/>
    <rect x="410" y="78" width="300" height="58" rx="8"/>
    <rect x="740" y="78" width="300" height="58" rx="8"/>
  </g>
  <text x="230" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">opencode</text>
  <text x="230" y="123" text-anchor="middle" font-size="11" fill="#64748b">MCP client</text>
  <text x="560" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">Claude Code</text>
  <text x="560" y="123" text-anchor="middle" font-size="11" fill="#64748b">MCP client</text>
  <text x="890" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">Claude Desktop</text>
  <text x="890" y="123" text-anchor="middle" font-size="11" fill="#64748b">MCP client</text>

  <!-- clients → server -->
  <line x1="560" y1="136" x2="560" y2="170" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="574" y="156" font-size="11" fill="#475569">POST /mcp · streamable HTTP · Authorization: Bearer &lt;token&gt;</text>

  <!-- Server -->
  <rect x="80" y="172" width="960" height="98" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="560" y="196" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">rag-mcp server — rmcp × axum</text>
  <text x="560" y="213" text-anchor="middle" font-size="11" fill="#64748b">thin transport layer; all retrieval logic lives in rag-core (below). Started by scripts/04-run-server.sh.</text>
  <g fill="#ffffff" stroke="#86efac">
    <rect x="96" y="228" width="180" height="30" rx="6"/>
    <rect x="345" y="228" width="180" height="30" rx="6"/>
    <rect x="594" y="228" width="180" height="30" rx="6"/>
    <rect x="843" y="228" width="180" height="30" rx="6"/>
  </g>
  <text x="186" y="247" text-anchor="middle" font-size="11" font-weight="600" fill="#15803d">search</text>
  <text x="435" y="247" text-anchor="middle" font-size="11" font-weight="600" fill="#15803d">keyword_search</text>
  <text x="684" y="247" text-anchor="middle" font-size="11" font-weight="600" fill="#15803d">vector_search</text>
  <text x="933" y="247" text-anchor="middle" font-size="11" font-weight="600" fill="#15803d">fetch_by_id</text>

  <!-- server → funnel -->
  <line x1="560" y1="270" x2="560" y2="310" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="574" y="293" font-size="11" fill="#475569">tool call</text>

  <!-- Funnel -->
  <rect x="80" y="318" width="960" height="132" rx="10" fill="#fffbeb" stroke="#d97706"/>
  <text x="560" y="341" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">RetrievalFunnel (rag-core — transport-independent)</text>
  <text x="100" y="365" font-size="12" fill="#334155">1 &#160;keyword pre-filter — tsvector (English/code) · ES·ik primary · pg_trgm fallback</text>
  <text x="100" y="385" font-size="12" fill="#334155">2 &#160;conditional ANN — pgvector cosine; skipped in hybrid mode when pre-filter is confident</text>
  <text x="100" y="405" font-size="12" fill="#334155">3 &#160;scoring — 0.6·exact + 0.35·ann + 0.05·metadata → ranked snippets (matched_via / matched_ann)</text>
  <text x="100" y="425" font-size="12" fill="#334155">4 &#160;content store — Postgres documents; fetch_by_id returns full content</text>

  <!-- funnel → backends -->
  <line x1="240" y1="450" x2="240" y2="512" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="580" y1="450" x2="580" y2="512" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="920" y1="450" x2="920" y2="512" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="248" y="486" font-size="10" fill="#475569">pre-filter + content store</text>
  <text x="588" y="486" font-size="10" fill="#475569">keyword hits (ES)</text>
  <text x="928" y="486" font-size="10" fill="#475569">query embedding</text>

  <!-- ② backends -->
  <text x="100" y="504" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1.5">② BACKENDS</text>

  <!-- Postgres -->
  <rect x="80" y="512" width="320" height="188" rx="10" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="240" y="540" text-anchor="middle" font-size="14" font-weight="700" fill="#0c4a6e">Postgres + pgvector</text>
  <text x="96" y="568" font-size="11" font-weight="600" fill="#0f172a">documents</text>
  <text x="96" y="585" font-size="11" fill="#334155">id · source · language · content · metadata</text>
  <text x="96" y="602" font-size="11" fill="#334155">search_vector — generated tsvector (simple) · GIN</text>
  <text x="96" y="619" font-size="11" fill="#334155">content pg_trgm (GIN) — fallback pre-filter</text>
  <text x="96" y="641" font-size="11" font-weight="600" fill="#0f172a">chunk_embeddings</text>
  <text x="96" y="658" font-size="11" fill="#334155">vector(1024) · HNSW cosine · FK cascade</text>
  <text x="96" y="684" font-size="10" fill="#475569">seeded by 03-seed.sh (upsert + cascade delete)</text>

  <!-- Elasticsearch -->
  <rect x="420" y="512" width="320" height="188" rx="10" fill="#fdf2f8" stroke="#db2777"/>
  <text x="580" y="540" text-anchor="middle" font-size="14" font-weight="700" fill="#831843">Elasticsearch</text>
  <text x="436" y="568" font-size="11" font-weight="600" fill="#0f172a">documents index</text>
  <text x="436" y="585" font-size="11" fill="#334155">content: text · ik_max_word (Chinese)</text>
  <text x="436" y="602" font-size="11" fill="#334155">source: keyword</text>
  <text x="436" y="619" font-size="11" fill="#334155">match + highlight &lt;em&gt;…&lt;/em&gt; fragment</text>
  <text x="436" y="641" font-size="11" fill="#334155">near-real-time — ~1s to be searchable</text>
  <text x="436" y="658" font-size="11" fill="#334155">pg_trgm fallback covers ES-down / unsynced</text>
  <text x="436" y="684" font-size="10" fill="#475569">seeded by 03-seed.sh (ES mirror)</text>

  <!-- Embedder -->
  <rect x="760" y="512" width="320" height="188" rx="10" fill="#faf5ff" stroke="#9333ea"/>
  <text x="920" y="540" text-anchor="middle" font-size="14" font-weight="700" fill="#581c87">Embedder — BGE-M3 (1024-dim)</text>
  <text x="776" y="568" font-size="11" font-weight="600" fill="#0f172a">OllamaEmbedder — priority</text>
  <text x="776" y="585" font-size="11" fill="#334155">remote POST /api/embed · bge-m3</text>
  <text x="776" y="602" font-size="11" fill="#334155">via Cloudflare tunnel · cold call ~40s</text>
  <text x="776" y="626" font-size="11" font-weight="600" fill="#0f172a">BgeM3Embedder — local ONNX</text>
  <text x="776" y="643" font-size="11" fill="#334155">ort runtime (ORT_DYLIB_PATH) · mean-pool</text>
  <text x="776" y="660" font-size="11" fill="#334155">model_int8.onnx + tokenizer.json</text>
  <text x="776" y="684" font-size="10" fill="#475569">chosen by RAG_MCP_OLLAMA_URL / MODEL_DIR</text>

  <!-- ③ seeding & tooling -->
  <text x="100" y="736" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1.5">③ SEEDING &amp; TOOLING (examples/scripts)</text>

  <g fill="#f8fafc" stroke="#94a3b8">
    <rect x="96" y="752" width="192" height="72" rx="8"/>
    <rect x="300" y="752" width="192" height="72" rx="8"/>
    <rect x="504" y="752" width="192" height="72" rx="8"/>
    <rect x="708" y="752" width="192" height="72" rx="8"/>
    <rect x="912" y="752" width="192" height="72" rx="8"/>
  </g>
  <text x="192" y="772" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">01-start-backends.sh</text>
  <text x="192" y="790" text-anchor="middle" font-size="10" fill="#334155">docker: pgvector:pg16</text>
  <text x="192" y="805" text-anchor="middle" font-size="10" fill="#334155">+ es-ik (analysis-ik)</text>
  <text x="396" y="772" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">02-apply-schema.sh</text>
  <text x="396" y="790" text-anchor="middle" font-size="10" fill="#334155">applies migrations/*.sql</text>
  <text x="396" y="805" text-anchor="middle" font-size="10" fill="#334155">extensions · tables · indexes</text>
  <text x="600" y="772" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">03-seed.sh</text>
  <text x="600" y="790" text-anchor="middle" font-size="10" fill="#334155">corpus.json → documents,</text>
  <text x="600" y="805" text-anchor="middle" font-size="10" fill="#334155">embeddings + ES mirror</text>
  <text x="804" y="772" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">04-run-server.sh</text>
  <text x="804" y="790" text-anchor="middle" font-size="10" fill="#334155">env defaults, then</text>
  <text x="804" y="805" text-anchor="middle" font-size="10" fill="#334155">cargo run -p rag-mcp</text>
  <text x="1008" y="772" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">05·06·08 helpers</text>
  <text x="1008" y="790" text-anchor="middle" font-size="10" fill="#334155">mcp-call · sample-queries</text>
  <text x="1008" y="805" text-anchor="middle" font-size="10" fill="#334155">· opencode-mcp register</text>

  <!-- seeding arrows up into the backends -->
  <line x1="600" y1="752" x2="580" y2="700" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="396" y1="752" x2="240" y2="700" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="574" y="741" text-anchor="end" font-size="10" fill="#475569">writes schema → PG; corpus + embeddings + ES mirror</text>

  <text x="560" y="872" text-anchor="middle" font-size="11" fill="#64748b">Query path: ① clients → server → funnel → ② backends.  Seeding: ③ fills schema + data into ②.  Live walkthrough: examples/quickstart.md</text>
</svg>
