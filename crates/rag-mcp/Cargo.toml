[package]
name = "rag-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

# NOTE: rmcp requires Rust 1.88+. This sandbox's apt-installed toolchain is
# 1.75, so this crate could not be compiled/tested here — build it locally
# or in CI with a current stable toolchain (e.g. via rustup).
[dependencies]
rag-core = { path = "../rag-core" }
rmcp = { version = "0.3", features = ["server", "transport-streamable-http-server", "transport-worker"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
schemars = "0.8"
anyhow = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# BGE-M3 via ONNX Runtime. The crate defaults to `download-binaries` (static
# pyke builds, requiring glibc >= 2.38). This sandbox is Debian 12 (glibc
# 2.36), so we use `load-dynamic` instead: ONNX Runtime is dlopen'd at runtime
# from `ORT_DYLIB_PATH` (we point it at the manylinux wheel's
# libonnxruntime.so, which only needs glibc 2.27).
ort = { version = "2.0.0-rc.13", default-features = false, features = ["ndarray", "tracing", "load-dynamic"] }
tokenizers = "0.23"
